name: Server and Web

on:
  push:
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: scadaguard
          POSTGRES_USER: scadaguard
          POSTGRES_PASSWORD: ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scadaguard -d scadaguard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      SCADAGUARD_DATABASE_URL: postgresql+asyncpg://scadaguard:ci-password@localhost:5432/scadaguard
      SCADAGUARD_SECRET_KEY: ci-only-secret-key-that-is-at-least-32-characters
      SCADAGUARD_COOKIE_SECURE: false
      SCADAGUARD_RUN_DB_TESTS: "1"
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff format --check app tests
      - run: ruff check app tests
      - run: mypy app
      - run: alembic upgrade head
      - run: pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t scadaguard-server:ci server
      - run: docker build -t scadaguard-web:ci web
      - name: Validate Compose
        env:
          POSTGRES_PASSWORD: validation-only-password
          SCADAGUARD_SECRET_KEY: validation-only-secret-key-that-is-at-least-32-characters
        run: docker compose -f deploy/docker-compose.yml config --quiet
